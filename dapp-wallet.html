<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Wallet | Bobo the Bear</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .wallet-selection-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--color-bg);
            padding: 20px;
        }
        
        .wallet-card {
            background-color: #d4bda1;
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 40px rgba(61, 43, 31, 0.15);
            border: 1px solid rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        
        .wallet-card h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #3d2b1f;
        }
        
        .wallet-card p {
            color: rgba(61, 43, 31, 0.7);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        
        .wallet-options {
            display: grid;
            gap: 12px;
        }
        
        .wallet-option {
            background-color: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            color: #3d2b1f;
        }
        
        .wallet-option:hover {
            background-color: rgba(255, 255, 255, 0.5);
            border-color: var(--color-brown);
            transform: scale(1.02);
        }
        
        .wallet-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .wallet-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background-color: rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #3d2b1f;
        }
        
        .wallet-name {
            font-weight: 500;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: rgba(61, 43, 31, 0.6);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }
        
        .back-link:hover {
            color: #3d2b1f;
        }
    </style>
</head>
<body class="body">
    <div class="wallet-selection-page">
        <div class="wallet-card">
            <h2>Connect Wallet</h2>
            <p>Select your favorite wallet to start migrating your $BOBO tokens.</p>
            
            <div class="wallet-options">
                <a href="#" class="wallet-option" onclick="alert('Connecting to MetaMask...')">
                    <div class="wallet-info">
                        <div class="wallet-icon">🦊</div>
                        <span class="wallet-name">MetaMask</span>
                    </div>
                    <span class="arrow">→</span>
                </a>
                <a href="#" class="wallet-option" onclick="alert('Connecting to Coinbase Wallet...')">
                    <div class="wallet-info">
                        <div class="wallet-icon">🛡️</div>
                        <span class="wallet-name">Coinbase Wallet</span>
                    </div>
                    <span class="arrow">→</span>
                </a>
                <a href="#" class="wallet-option" onclick="alert('Opening WalletConnect...')">
                    <div class="wallet-info">
                        <div class="wallet-icon">🌐</div>
                        <span class="wallet-name">WalletConnect</span>
                    </div>
                    <span class="arrow">→</span>
                </a>
                <a href="#" class="wallet-option" onclick="alert('Trust Wallet selected...')">
                    <div class="wallet-info">
                        <div class="wallet-icon">📱</div>
                        <span class="wallet-name">Trust Wallet</span>
                    </div>
                    <span class="arrow">→</span>
                </a>
            </div>
            
            <a href="index.html" class="back-link">Back to Main Site</a>
        </div>
    </div>
</body>
</html>
